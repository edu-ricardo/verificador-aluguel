services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: aluguel_temporada
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5025}:8000"
      - "${BACKEND_PORT:-8025}:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/aluguel.db
      - ENVIRONMENT=production
      - CACHE_TTL_HOURS=4
    volumes:
      - aluguel_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  aluguel_data:
    driver: local
