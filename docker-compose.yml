services:
  postgres:
    image: postgres:16-alpine
    container_name: aluguel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-verificador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senha_segura_homelab_123}
      POSTGRES_DB: ${POSTGRES_DB:-aluguel_temporada}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verificador} -d ${POSTGRES_DB:-aluguel_temporada}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aluguel_net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: aluguel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aluguel_net
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aluguel_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-verificador}:${POSTGRES_PASSWORD:-senha_segura_homelab_123}@postgres:5432/${POSTGRES_DB:-aluguel_temporada}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS:-["*"]}
      - CACHE_TTL_HOURS=${CACHE_TTL_HOURS:-4}
    ports:
      - "${BACKEND_PORT:-8025}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aluguel_net
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8025/api/v1}
    container_name: aluguel_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5025}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - aluguel_net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  aluguel_net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
